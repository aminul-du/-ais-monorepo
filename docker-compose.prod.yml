services:
  ai-orchestrator:
    build: { context: ./apps/ai-orchestrator }
    image: mcore-ai-orchestrator:prod
    restart: unless-stopped
    expose: ["8080"]
    environment:
      MCORE_POLICY_PATH: /policy/poison-lifecycle.yaml
    volumes:
      - ./config/policy/poison-lifecycle.yaml:/policy/poison-lifecycle.yaml:ro

  core-api:
    build: { context: ./apps/core-api }
    image: mcore-core-api:prod
    restart: unless-stopped
    expose: ["8080"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: mcore-web:prod
    restart: unless-stopped
    expose: ["3000"]
    environment:
      NODE_ENV: production

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # ← HTTP/3 QUIC
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ai-orchestrator
      - core-api
      - web

volumes:
  caddy_data:
  caddy_config:
