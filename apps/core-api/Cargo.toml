[package]
name = "mcore-core-api"
version = "0.1.0"
edition = "2021"
authors = ["Aminul Islam Shamim <me@aminul-du.com>"]
description = "MCore OSINT / telemetry API"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
