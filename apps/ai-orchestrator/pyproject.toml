[project]
name = "mcore-ai-orchestrator"
version = "0.1.0"
description = "MCore skill-aware AI agent"
authors = [{ name = "Aminul Islam Shamim", email = "me@aminul-du.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
